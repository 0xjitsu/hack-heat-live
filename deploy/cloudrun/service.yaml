apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hack-heat-live
  labels:
    cloud.googleapis.com/location: asia-southeast1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
        - image: asia-southeast1-docker.pkg.dev/PROJECT_ID/hack-heat/hack-heat-live:0.1.0
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HACKHEAT_HOST
              value: "0.0.0.0"
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
