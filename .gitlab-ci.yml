# Hack Heat Live — lint, test, and build on every push.
# secure and monitor are extra stages so the pipeline history shows more of
# the post-code lifecycle. deploy_production is the supervised gate: the
# pipeline passes without it, and a person starts it on purpose.

stages:
  - lint
  - test
  - secure
  - build
  - release
  - monitor

# GitLab's own SAST and secret detection (available on every tier).
# Their jobs are moved into the secure stage next to the repo's secret scan.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

default:
  image: python:3.12-slim
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

lint:
  stage: lint
  script:
    - python -m hackheat.ci lint

test:
  stage: test
  script:
    - python -m unittest discover -s tests -v

secure:
  stage: secure
  script:
    - python -m hackheat.ci secrets

sast:
  stage: secure

secret_detection:
  stage: secure

build:
  stage: build
  script:
    - python -m hackheat.ci package
    - python -m hackheat.ci deploy-check
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Runs only when a tag such as v0.1.0 is pushed. Creates a GitLab Release.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build
      artifacts: true
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Hack Heat Live $CI_COMMIT_TAG"
    description: "Hack Heat Live $CI_COMMIT_TAG. Path A, Supervised. The zip bundle is the build job artifact."

freshness:
  stage: monitor
  script:
    - python -m hackheat.ci freshness

# Supervised production gate. Optional, so a normal pipeline stays green.
# Playing this job does not call gcloud. It prints the Cloud Run command
# after checking the deployment files. Run that command from a logged-in shell.
deploy_production:
  stage: monitor
  when: manual
  allow_failure: true
  environment:
    name: production
    action: prepare
  script:
    - python -m hackheat.ci deploy-check
